# _Seams.yaml - Single source of truth for ASCIICrabs seam numbers.
# Regenerate the seam table by running: python3 Hatch/SyncSeams.py _Seams.yaml
#
# Never edit _Seams.h by hand -- edit this file and re-run SyncSeams.py.
#
# Seam numbering is monotonic and topological: each seam is built on top of
# everything below it, and the release seam (highest number) is the final
# sown test pass that runs the whole tree. To add a new seam, append to the
# list and re-run SyncSeams.py.
#
# NOTE: The ASCIICrabs repo's own _Seams/ tree is hand-maintained (namespace
# CRTest, custom _Main.hxx/_Tests.hxx layout) and the generator's flat
# scaffold format does not match it. This yaml is the source of truth for
# the seam TABLE (names + numbers + topological order); keep _Seams/_Seams.h
# and the root _Seams.h in sync with it.

project: ASCIICrabs
mode: ASCIICrabs
release: _CrabsRelease

seams:
  - name: _CrabsCore
    module: Crabs
    file: 01.Core.hxx
    label: "Testing Crabs core types..."

  - name: _CrabsIToS
    module: Crabs
    file: 02.ItoS.hxx
    label: "Testing ITOS conversion..."

